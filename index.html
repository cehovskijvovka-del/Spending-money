<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spending Money — Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;padding:20px;color:#222}
.quiz{width:100%;max-width:600px;background:#fff;border-radius:25px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{text-align:center;margin-top:0;color:#5b4bc4}
.subtitle{text-align:center;color:#777;margin-bottom:25px}
.top{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:bold}
.progress{width:100%;height:10px;background:#eee;border-radius:10px;overflow:hidden;margin-bottom:30px}
.progress-bar{height:100%;width:0;background:#667eea;transition:.3s}
.word{text-align:center;font-size:32px;margin:25px 0;color:#333}
.question{text-align:center;color:#777}
.answers{display:grid;gap:12px}
.answer{border:2px solid #ddd;background:#fff;padding:16px;border-radius:14px;font-size:16px;cursor:pointer;transition:.2s}
.answer:hover{border-color:#667eea;background:#f5f5ff}
.answer.correct{background:#d8f8df;border-color:#35a853}
.answer.wrong{background:#ffdede;border-color:#e53935}
.answer:disabled{cursor:default}
.feedback{text-align:center;font-size:18px;font-weight:bold;margin:20px 0;min-height:25px}
.next,.restart{display:block;margin:10px auto 0;padding:14px 30px;border:none;border-radius:14px;background:#667eea;color:white;font-size:17px;font-weight:bold;cursor:pointer}
.next:hover,.restart:hover{background:#5546d6}
.result{text-align:center}
.result h2{font-size:32px;color:#5b4bc4}
.result-score{font-size:25px;margin:25px 0}
.hidden{display:none}
@media(max-width:500px){.quiz{padding:20px}.word{font-size:25px}}
</style>
</head>
<body>
<div class="quiz">
<div id="game">
<h1>💰 Spending Money</h1>
<div class="subtitle">English Vocabulary Quiz</div>
<div class="top">
<span id="questionNumber">Вопрос 1 из 13</span>
<span id="score">Счёт: 0</span>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="question">Выбери правильный перевод:</div>
<div class="word" id="word"></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<button class="next hidden" id="nextButton">Следующий вопрос →</button>
</div>
<div class="result hidden" id="result">
<h2>🎉 Викторина окончена!</h2>
<div class="result-score" id="resultScore"></div>
<p id="resultText"></p>
<button class="restart" id="restartButton">🔄 Играть снова</button>
</div>
</div>

<script>
const words=[
["clothes and accessories","одежда и аксессуары"],
["household bills","счета за домашние расходы"],
["eating out","питание вне дома"],
["mobile phone cards","карточки / пополнение мобильного телефона"],
["sweets and snacks","сладости и закуски"],
["rent","аренда"],
["bus fares","плата за проезд на автобусе"],
["petrol","бензин"],
["computer games","компьютерные игры"],
["CDs/DVDs","CD и DVD"],
["going out","развлечения / выходы куда-нибудь"],
["magazines/books/comics","журналы / книги / комиксы"],
["supermarket shopping","покупки в супермаркете"]
];

let questions=[],current=0,score=0,answered=false;

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function startQuiz(){
 questions=shuffle(words);current=0;score=0;
 $("game").classList.remove("hidden");
 $("result").classList.add("hidden");
 showQuestion();
}

function showQuestion(){
 answered=false;
 const q=questions[current];
 $("word").textContent=q[0];
 $("questionNumber").textContent=`Вопрос ${current+1} из ${questions.length}`;
 $("score").textContent=`Счёт: ${score}`;
 $("progressBar").style.width=`${current/questions.length*100}%`;
 $("feedback").textContent="";
 $("nextButton").classList.add("hidden");
 $("answers").innerHTML="";

 const wrong=shuffle(words.filter(x=>x[1]!==q[1])).slice(0,3).map(x=>x[1]);
 shuffle([q[1],...wrong]).forEach(answer=>{
   const b=document.createElement("button");
   b.className="answer";
   b.textContent=answer;
   b.onclick=()=>checkAnswer(b,answer,q[1]);
   $("answers").appendChild(b);
 });
}

function checkAnswer(button,selected,correct){
 if(answered)return;
 answered=true;
 document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

 if(selected===correct){
   button.classList.add("correct");
   $("feedback").textContent="✅ Правильно!";
   score++;
 }else{
   button.classList.add("wrong");
   $("feedback").textContent=`❌ Неправильно! Правильный ответ: ${correct}`;
   document.querySelectorAll(".answer").forEach(b=>{
     if(b.textContent===correct)b.classList.add("correct");
   });
 }
 $("score").textContent=`Счёт: ${score}`;
 $("nextButton").classList.remove("hidden");
}

$("nextButton").onclick=()=>{
 current++;
 if(current>=questions.length)finishQuiz();
 else showQuestion();
};

function finishQuiz(){
 $("game").classList.add("hidden");
 $("result").classList.remove("hidden");
 const percent=Math.round(score/questions.length*100);
 $("resultScore").textContent=`${score} / ${questions.length} — ${percent}%`;

 if(percent===100)$("resultText").textContent="🔥 Идеально! Ты знаешь все слова!";
 else if(percent>=80)$("resultText").textContent="💪 Отличный результат!";
 else if(percent>=60)$("resultText").textContent="👍 Неплохо! Можно ещё немного потренироваться.";
 else $("resultText").textContent="📚 Повтори слова и попробуй ещё раз!";
}

$("restartButton").onclick=startQuiz;
startQuiz();
</script>
</body>
</html>
